services:
  backend:
    build: ./backend/
    networks:
      - net
    depends_on:
      - database
    volumes:
      - static_files:/app/public

  database:
    image: postgres:alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      TZ: Europe/Moscow
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - static_files:/usr/share/nginx/html/public
    depends_on:
      - backend
    networks:
      - net



volumes:
  static_files:

networks:
  net:
      
